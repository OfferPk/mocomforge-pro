<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182335" />
      <stop offset="100%" stop-color="#121a29" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="500" x2="1000" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
  </g>

  <!-- Title & Header -->
  <text x="50" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold">MOCOMForge Pro: CCSDS 522.0-B-1 Architecture</text>
  <text x="50" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Mission Operations Common Services (MO-CS / MOCOM) &amp; ISO 20215 Reference Architecture</text>

  <!-- Top Layer: Mission Application Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="900" height="70" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="142" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">MISSION APPLICATION LAYER (MOC / MCC / SOC)</text>
    <text x="70" y="163" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Telemetry Displays • Flight Dynamics Engine • Command Sequencer • Autonomous Ops Agents</text>
  </g>

  <!-- Connection arrows -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none">
    <line x1="200" y1="180" x2="200" y2="230" />
    <line x1="500" y1="180" x2="500" y2="230" />
    <line x1="800" y1="180" x2="800" y2="230" />
  </g>

  <!-- Middle Layer: CCSDS 522.0 Common Services -->
  <g filter="url(#shadow)">
    <!-- Box 1: Directory Service -->
    <rect x="50" y="230" width="280" height="150" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="65" y="245" width="30" height="30" rx="6" fill="#0891b2" />
    <text x="74" y="266" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">DS</text>
    <text x="105" y="265" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Directory Service</text>
    <text x="65" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">CCSDS 522.0-B-1 §3</text>
    <text x="65" y="320" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Dynamic MAL URI Resolution</text>
    <text x="65" y="340" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Provider Registration &amp; Lookup</text>
    <text x="65" y="360" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Multi-Domain Failover Routing</text>

    <!-- Box 2: Login Service -->
    <rect x="360" y="230" width="280" height="150" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="375" y="245" width="30" height="30" rx="6" fill="#059669" />
    <text x="383" y="266" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">LS</text>
    <text x="415" y="265" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Login Service</text>
    <text x="375" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">CCSDS 522.0-B-1 §4</text>
    <text x="375" y="320" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Operator Authentication</text>
    <text x="375" y="340" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• High-Entropy Session Tokens</text>
    <text x="375" y="360" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Multi-Tier RBAC Gating</text>

    <!-- Box 3: Configuration Service -->
    <rect x="670" y="230" width="280" height="150" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="685" y="245" width="30" height="30" rx="6" fill="#7c3aed" />
    <text x="693" y="266" fill="#fff" font-family="monospace" font-size="14" font-weight="bold">CS</text>
    <text x="725" y="265" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Configuration Service</text>
    <text x="685" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">CCSDS 522.0-B-1 §5</text>
    <text x="685" y="320" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Immutable Baseline Snapshots</text>
    <text x="685" y="340" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Atomic Activation &amp; Rollback</text>
    <text x="685" y="360" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">• Parameter Differential (Diff) Engine</text>
  </g>

  <!-- Connection arrows -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" fill="none">
    <line x1="200" y1="380" x2="200" y2="430" />
    <line x1="500" y1="380" x2="500" y2="430" />
    <line x1="800" y1="380" x2="800" y2="430" />
  </g>

  <!-- Bottom Layer: Message Abstraction Layer (MAL) -->
  <g filter="url(#shadow)">
    <rect x="50" y="430" width="900" height="120" rx="8" fill="url(#cardGrad)" stroke="#64748b" stroke-width="1.5" />
    <text x="70" y="460" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">CCSDS 521.0-B-2 MESSAGE ABSTRACTION LAYER (MAL)</text>
    <text x="70" y="482" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Interaction Patterns: Send • Submit • Request • Invoke • Progress • Publish/Subscribe</text>

    <!-- Sub-transport chips -->
    <rect x="70" y="500" width="190" height="32" rx="4" fill="#1e293b" />
    <text x="85" y="521" fill="#38bdf8" font-family="monospace" font-size="11">MAL-TCP Transport</text>

    <rect x="280" y="500" width="200" height="32" rx="4" fill="#1e293b" />
    <text x="295" y="521" fill="#10b981" font-family="monospace" font-size="11">MAL-SpacePacket Binding</text>

    <rect x="500" y="500" width="190" height="32" rx="4" fill="#1e293b" />
    <text x="515" y="521" fill="#f59e0b" font-family="monospace" font-size="11">MAL-ZeroMQ Binding</text>

    <rect x="710" y="500" width="220" height="32" rx="4" fill="#1e293b" />
    <text x="725" y="521" fill="#a855f7" font-family="monospace" font-size="11">MAL-WebSocket Gateway</text>
  </g>
</svg>
